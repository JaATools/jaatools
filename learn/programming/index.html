<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bit by Bit — C++</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%2252%22%20height%3D%2252%22%20rx%3D%2215%22%20fill%3D%22%237458F0%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2213%22%20width%3D%2238%22%20height%3D%2238%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2229%22%20r%3D%223.6%22%20fill%3D%22%231A1D3A%22%2F%3E%3Ccircle%20cx%3D%2239%22%20cy%3D%2229%22%20r%3D%223.6%22%20fill%3D%22%231A1D3A%22%2F%3E%3Cpath%20d%3D%22M25%2038q7%206%2014%200%22%20fill%3D%22none%22%20stroke%3D%22%231A1D3A%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#F5F2EA; --card:#FFFFFF; --ink:#1A1D3A; --muted:#676B8A; --line:#E3DED0; --soft:#EFEBDF;
  --good:#17935B; --good-bg:#DCF4E6; --bad:#D63E41; --bad-bg:#FBE2E2; --gold:#F2A900;
  --code-bg:#161930; --code-ink:#E7E9F7; --code-dim:#7C82A8; --hero:#1A1D3A;
  --teal:#0E9F8E; --orange:#EA6A27; --violet:#7458F0; --pink:#D93D84; --blue:#2A76EA;
  --hue:var(--violet);
  --shadow:0 1px 0 rgba(26,29,58,.04),0 10px 26px -14px rgba(26,29,58,.22);
  --sans:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
:root[data-theme=dark]{
  --bg:#0E1022; --card:#181B33; --ink:#ECEEFB; --muted:#9BA0C4; --line:#2B2F50; --soft:#20243F;
  --good:#3DD08D; --good-bg:#11362A; --bad:#FF7A7C; --bad-bg:#40191D; --code-bg:#090B1A; --hero:#20244A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.8);
}
.h-teal{--hue:var(--teal)} .h-orange{--hue:var(--orange)} .h-violet{--hue:var(--violet)} .h-pink{--hue:var(--pink)} .h-blue{--hue:var(--blue)}
*{box-sizing:border-box}
*,*::before,*::after{font-variant-ligatures:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:7px;white-space:pre-wrap}
.wrap{max-width:780px;margin:0 auto;padding:0 16px;width:100%}
:focus-visible{outline:3px solid color-mix(in srgb,var(--hue) 60%,transparent);outline-offset:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--hue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--hue) 68%,#000);transition:transform .06s,box-shadow .06s,filter .15s;user-select:none;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--hue) 68%,#000)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 82%,#000);cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.sm{padding:8px 13px;border-radius:11px;font-size:14px;box-shadow:0 3px 0 color-mix(in srgb,var(--hue) 68%,#000)}
.btn.sm.ghost{box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.good{--hue:var(--good)} .btn.bad{--hue:var(--bad)} .btn.gold{--hue:#D99400}
.btn.wide{width:100%}
.link{background:none;border:0;padding:4px 2px;color:var(--muted);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.link:hover{color:var(--ink)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:16px;font-weight:800;flex:none}
.icon-btn:hover{border-color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:-.03em;background:none;border:0;cursor:pointer;padding:0}
.brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:8px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--bg)}
@media(max-width:560px){.brand small,.hide-s{display:none}.top .wrap{gap:6px}}

/* ---------- home ---------- */
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;margin-top:20px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.2px);background-size:18px 18px;mask-image:linear-gradient(120deg,transparent 30%,#000);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000);pointer-events:none}
.hero>*{position:relative}
.hero h1{font-size:clamp(26px,5.4vw,36px);font-weight:900}
.hero h1 em{font-style:normal;color:#FFD666}
.hero p{opacity:.82;margin-top:8px;max-width:44ch}
.hero .bit{animation:bob 3.2s ease-in-out infinite}
.lvl{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:6px;font-weight:800;font-size:13px}
.lvl .bar{flex:1;height:10px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:#FFD666;border-radius:99px}
.hero .btn{--hue:#FFD666;color:#1A1D3A;grid-column:1/-1;justify-self:start;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:2px}
.tile:hover{transform:translateY(-2px);border-color:var(--hue)}
.tile .em{font-size:24px}
.tile b{font-size:15px;font-weight:900;line-height:1.2}
.tile small{color:var(--muted);font-size:12px;line-height:1.3}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.world{margin-top:36px}
.w-head{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:var(--hue);color:#fff;position:relative;overflow:hidden}
.w-head:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.w-ico{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.w-num{font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.9}
.w-title{font-size:22px;font-weight:900}
.w-sub{font-size:13.5px;opacity:.92}
.w-prog{margin-left:auto;font-weight:900;font-size:13px;background:rgba(0,0,0,.18);padding:5px 10px;border-radius:99px;position:relative;z-index:1;white-space:nowrap}
.path{padding:22px 0 0;display:flex;flex-direction:column;gap:14px;position:relative}
.node{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;cursor:pointer;margin-left:var(--x,0px);max-width:calc(100% - var(--x,0px))}
.orb{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--card);box-shadow:inset 0 0 0 3px var(--line),0 5px 0 var(--line);flex:none;transition:transform .08s;position:relative}
.node:hover .orb{transform:translateY(-2px)}
.node:active .orb{transform:translateY(3px)}
.node.done .orb{background:var(--hue);box-shadow:0 5px 0 color-mix(in srgb,var(--hue) 62%,#000)}
.node.next .orb{box-shadow:inset 0 0 0 3px var(--hue),0 5px 0 var(--hue);animation:pulse 1.7s infinite}
.node.next .orb:after{content:attr(data-go);position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:10px;font-weight:900;letter-spacing:.08em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.n-lbl b{display:block;font-weight:900;font-size:16px;line-height:1.25}
.n-lbl small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.stars{font-size:13px;letter-spacing:1px;color:var(--gold)}
.stars i{font-style:normal;color:var(--line)}
.node.boss .orb{width:84px;height:84px;border-radius:26px;background:var(--hero);box-shadow:0 5px 0 #000}
.node.boss.done .orb{background:var(--hero);box-shadow:0 5px 0 var(--gold),inset 0 0 0 3px var(--gold)}
.badge{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--hue)}
.foot{margin:44px 0 30px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- player ---------- */
.player{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.p-top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:780px;margin:0 auto;width:100%}
.p-bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.p-bar i{display:block;height:100%;border-radius:99px;background:var(--hue);transition:width .4s cubic-bezier(.2,.8,.2,1);min-width:14px}
.p-body{flex:1;padding:10px 0 28px}
.p-foot{position:sticky;bottom:0;border-top:2px solid var(--line);padding:14px 0 16px;background:var(--bg);z-index:5}
.p-foot.good{background:var(--good-bg);border-color:transparent}
.p-foot.bad{background:var(--bad-bg);border-color:transparent}
.p-foot .wrap{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fb{flex:1;min-width:230px}
.fb h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.good .fb h3{color:var(--good)} .bad .fb h3{color:var(--bad)}
.fb p{font-size:14.5px;margin-top:4px;max-width:62ch}
.fb .ans{font-family:var(--mono);font-size:13.5px;margin-top:6px;white-space:pre-wrap;background:rgba(127,127,127,.12);padding:6px 10px;border-radius:9px;display:inline-block}
.p-foot .btn{min-width:150px}
.hearts{font-size:17px;letter-spacing:2px;white-space:nowrap}
.combo{font-weight:900;font-size:14px;color:var(--orange);white-space:nowrap;min-width:38px;text-align:right}
.q{margin:6px 0 16px}
.tag{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--hue);background:color-mix(in srgb,var(--hue) 13%,transparent);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.q h2{font-size:clamp(19px,3.6vw,24px);font-weight:900}
.q h2 code{font-size:.82em}
.lead{font-size:16.5px;margin:0 0 16px;max-width:66ch}
.step>*+*{margin-top:14px}
.anim{animation:rise .32s cubic-bezier(.2,.8,.2,1)}

/* ---------- code ---------- */
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.7;border-radius:16px;padding:12px 0;overflow-x:auto;tab-size:4}
.code .ln{display:flex;padding-right:16px;white-space:pre;min-width:max-content;position:relative}
.code .no{width:38px;text-align:right;padding-right:12px;color:var(--code-dim);user-select:none;flex:none;font-size:12px}
.code .ln.on{background:rgba(255,214,102,.15);box-shadow:inset 4px 0 0 #FFD666}
.code .ln.err{background:rgba(255,90,90,.2);box-shadow:inset 4px 0 0 #FF6B6B}
.code.pick .ln{cursor:pointer}
.code.pick .ln:hover{background:rgba(255,255,255,.07)}
.code.pick .ln.sel{background:rgba(116,88,240,.4);box-shadow:inset 4px 0 0 #A796FF}
.code.pick .ln.ok{background:rgba(61,208,141,.28);box-shadow:inset 4px 0 0 #3DD08D}
.code.pick .ln.no2{background:rgba(255,107,107,.28);box-shadow:inset 4px 0 0 #FF6B6B}
.code i{font-style:normal}
.c-kw{color:#FF9E7A}.c-ty{color:#6FD3F2}.c-num{color:#FFD666}.c-str{color:#A8E38A}.c-com{color:#737AA6}.c-pre{color:#C3A6FF}.c-io{color:#F3A6D8}
.blank{display:inline-block;min-width:52px;text-align:center;border:2px dashed #7C82A8;border-radius:8px;padding:0 8px;margin:0 2px;cursor:pointer;color:#FFD666;background:rgba(255,255,255,.06);line-height:1.5;font:inherit}
.blank.full{border-style:solid;border-color:#FFD666}
.blank.ok{border-color:#3DD08D;color:#3DD08D}.blank.no{border-color:#FF6B6B;color:#FF6B6B}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tok{font-family:var(--mono);font-weight:700;font-size:14.5px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;cursor:pointer;white-space:pre}
.tok:hover{border-color:var(--hue)}
.tok.used{opacity:.25;pointer-events:none}

/* ---------- options ---------- */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;transition:border-color .1s,background .1s;min-height:54px}
.opt:hover{border-color:color-mix(in srgb,var(--hue) 55%,var(--line))}
.opt .key{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);flex:none}
.opt .otx{white-space:pre-wrap;word-break:break-word}
.opt.mono .otx{font-family:var(--mono);font-size:14.5px}
.opt.sel{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 10%,var(--card))}
.opt.sel .key{border-color:var(--hue);color:var(--hue)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .key{border-color:var(--good);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .key{border-color:var(--bad);color:var(--bad)}
.locked .opt{cursor:default}

/* ---------- order puzzle ---------- */
.ord{display:grid;gap:8px}
.ord-box{min-height:58px;border-radius:16px;padding:10px;display:grid;gap:6px;align-content:start}
.ord-ans{background:var(--code-bg);border:2px solid transparent}
.ord-ans:empty:before{content:attr(data-ph);color:var(--code-dim);font-size:14px;padding:8px}
.ord-pool{border:2px dashed var(--line)}
.oline{font-family:var(--mono);font-size:14px;text-align:left;white-space:pre;border-radius:10px;padding:8px 12px;cursor:pointer;border:2px solid #343a6b;border-bottom-width:4px;background:#22264a;color:var(--code-ink);overflow-x:auto}
.oline i{font-style:normal}
.ord-ans .oline{background:#2b3060;border-color:#4a5196}
.oline:hover{border-color:var(--hue)}

/* ---------- inputs ---------- */
.inp{font-family:var(--mono);font-size:15px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.inp:focus{outline:none;border-color:var(--hue)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.inp.ok{border-color:var(--good);background:var(--good-bg)} .inp.no{border-color:var(--bad);background:var(--bad-bg)}
.inl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted);flex:1;min-width:200px;white-space:nowrap}
.goal{display:inline-flex;align-items:center;gap:8px;font-weight:800;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:2px solid var(--gold);padding:6px 12px;border-radius:12px}
.goal code{background:none;border:0;font-size:15px;padding:0}

/* ---------- trace table ---------- */
.tr-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--card)}
table.tr{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:14px}
.tr th{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 8px;border-bottom:2px solid var(--line);text-align:center;background:var(--soft)}
.tr th:first-child,.tr td:first-child{text-align:left;padding-left:14px}
.tr th.v{font-family:var(--mono);font-size:14px;text-transform:none;color:var(--ink)}
.tr td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center}
.tr tr:last-child td{border-bottom:0}
.tr td.st{white-space:pre;color:var(--muted);font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tr td.st b{color:var(--ink);font-weight:600}
.tr input{width:64px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:700;padding:7px 4px;border:2px solid var(--line);border-radius:9px;background:var(--bg)}
.tr input:focus{outline:none;border-color:var(--hue)}
.tr input.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.tr input.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.tr .fix{display:block;font-size:11.5px;color:var(--good);font-weight:800;margin-top:2px}
.tr .na{color:var(--line)}
.note{font-size:14px;font-weight:700;padding:9px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.note.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.note.good{background:var(--good-bg);border-color:transparent;color:var(--good)}

/* ---------- sort game ---------- */
.sorter{display:grid;gap:16px;justify-items:center}
.s-card{font-family:var(--mono);font-weight:700;font-size:clamp(16px,3.6vw,21px);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:22px 18px;min-height:92px;width:100%;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow)}
.s-card.txt{font-family:var(--sans)}
.s-card.ok{border-color:var(--good);background:var(--good-bg)} .s-card.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.s-bins{display:grid;gap:10px;width:100%;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.s-bins .btn{font-family:var(--mono)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--hue) 40%,transparent);background:var(--hue)}

/* ---------- stepper ---------- */
.stp{border:2px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden}
.stp .code{border-radius:0;max-height:330px;overflow:auto}
.stp-say{min-height:46px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.stp-say .hint{color:var(--muted);font-weight:600}
.tape{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tape.t{background:var(--good-bg);border-color:transparent;color:var(--good)} .tape.f{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tape.set{background:color-mix(in srgb,var(--gold) 20%,var(--card));border-color:transparent}
.tape.chop{background:color-mix(in srgb,var(--orange) 18%,var(--card));border-color:transparent}
.stp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.stp-grid.solo{grid-template-columns:1fr}
.stp-mem{padding:12px 14px;min-height:96px}
.stp-grid:not(.solo) .stp-mem{border-right:1px solid var(--line)}
.cap{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.frame{border:2px dashed var(--line);border-radius:14px;padding:9px 10px 11px;margin-top:8px}
.frame.top{border-color:var(--hue);border-style:solid}
.frame>b{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}
.frame.top>b{color:var(--hue)}
.boxes{display:flex;flex-wrap:wrap;gap:16px 10px;margin-top:14px}
.box{min-width:56px;border-radius:11px;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;text-align:center;position:relative;padding:13px 8px 5px}
.box .bn{position:absolute;top:-11px;left:7px;background:var(--ink);color:var(--bg);font:700 11px/1.5 var(--mono);padding:0 6px;border-radius:6px;white-space:nowrap}
.box .bv{font:700 17px/1.2 var(--mono);display:block}
.box .bt{display:block;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box.t-int{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}
.box.t-double{border-color:color-mix(in srgb,var(--violet) 60%,var(--line));border-radius:11px 22px 11px 11px}
.box.t-char{border-color:color-mix(in srgb,var(--orange) 60%,var(--line));min-width:46px}
.box.t-bool{border-color:color-mix(in srgb,var(--pink) 60%,var(--line));border-radius:99px;padding-left:12px;padding-right:12px}
.box.und .bv{color:var(--muted)}
.box.chg{animation:pop .5s cubic-bezier(.3,1.6,.5,1);background:color-mix(in srgb,var(--gold) 26%,var(--bg))}
.box.ref{border-style:dashed;background:color-mix(in srgb,var(--hue) 9%,var(--bg))}
.box.ref .bn{background:var(--hue);color:#fff}
.box.const .bn:after{content:" 🔒";font-size:9px}
.arr{position:relative;padding-top:2px}
.arr .bn{position:absolute;top:-11px;left:7px;background:var(--ink);color:var(--bg);font:700 11px/1.5 var(--mono);padding:0 6px;border-radius:6px;z-index:1;white-space:nowrap}
.arr.ref .bn{background:var(--hue);color:#fff}
.cells{display:flex;border:2px solid color-mix(in srgb,var(--blue) 60%,var(--line));border-bottom-width:4px;border-radius:11px;overflow:hidden;background:var(--bg)}
.cell{min-width:42px;padding:11px 6px 2px;text-align:center;border-right:1px solid var(--line);font:700 16px/1.2 var(--mono)}
.cell:last-child{border-right:0}
.cell small{display:block;font:800 9.5px var(--sans);color:var(--muted);margin-top:2px}
.cell.chg{animation:pop .5s cubic-bezier(.3,1.6,.5,1);background:color-mix(in srgb,var(--gold) 30%,var(--bg))}
.cell.tch{background:color-mix(in srgb,var(--blue) 18%,var(--bg))}
.console{background:#0B0D1D;color:#D7F5DD;font:13.5px/1.55 var(--mono);padding:12px 14px;margin:0;white-space:pre-wrap;word-break:break-word;min-height:74px;overflow:auto;max-height:260px}
.console .in{color:#FFD666}
.console .dim{color:#6C7299}
.console.round{border-radius:14px}
.stp-con{display:flex;flex-direction:column;background:#0B0D1D}
.stp-con .cap{color:#6C7299;margin:10px 14px 0}
.stp-con .console{flex:1}
.stp-ctl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.stp-ctl input[type=range]{flex:1;min-width:80px;accent-color:var(--hue)}
.stp-ctl .cnt{font:700 12px var(--mono);color:var(--muted);min-width:52px;text-align:right}
@media(max-width:620px){.stp-grid{grid-template-columns:1fr}.stp-grid:not(.solo) .stp-mem{border-right:0;border-bottom:1px solid var(--line)}}
.errbox{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:11px 14px;font-weight:700;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.errbox b{white-space:nowrap}
.errbox code{background:rgba(127,127,127,.15);border:0;color:inherit}

/* ---------- editor ---------- */
.ed{display:flex;background:var(--code-bg);border-radius:16px;overflow:hidden;font:14px/1.65 var(--mono);border:2px solid transparent}
.ed:focus-within{border-color:var(--hue)}
.ed-gut{padding:12px 0;width:42px;text-align:right;color:var(--code-dim);font-size:12px;line-height:23.1px;user-select:none;flex:none}
.ed-gut div{padding-right:10px}
.ed-gut .err{background:#FF6B6B;color:#1A1D3A;font-weight:800;border-radius:0 6px 6px 0}
.ed-main{flex:1;overflow-x:auto;min-width:0}
.ed-in{position:relative;width:max-content;min-width:100%}
.ed-pre,.ed-ta{margin:0;padding:12px 16px 12px 4px;font:inherit;line-height:23.1px;white-space:pre;tab-size:4;border:0;letter-spacing:0}
.ed-pre{color:var(--code-ink);min-height:150px;pointer-events:none}
.ed-pre i{font-style:normal}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:#FFD666;outline:none;overflow:hidden}
.ed-ta::selection{background:rgba(116,88,240,.5)}
.task{display:grid;gap:12px}
.task-q{font-size:15.5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.tests{display:grid;gap:8px}
.test{border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;background:var(--card)}
.test.ok{border-color:var(--good);background:var(--good-bg)} .test.no{border-color:var(--bad);background:var(--bad-bg)}
.test b{font-weight:900}
.test pre{font:13px/1.45 var(--mono);margin:5px 0 0;white-space:pre-wrap;word-break:break-word}
.test .k{font:800 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* ---------- toys ---------- */
.toy{border:2px solid var(--line);border-radius:20px;background:var(--card);padding:16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.sl{display:grid;gap:2px;font-family:var(--mono);font-weight:700;font-size:15px;flex:1;min-width:130px}
.sl input{accent-color:var(--hue);width:100%}
.packs{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:flex-start}
.pack{display:flex;flex-wrap:wrap;gap:4px;padding:7px;border-radius:12px;background:color-mix(in srgb,var(--teal) 16%,var(--card));border:2px solid var(--teal);max-width:128px;animation:rise .25s}
.pack i{width:14px;height:14px;border-radius:5px;background:var(--teal);display:block}
.pack.left{background:color-mix(in srgb,var(--orange) 14%,var(--card));border:2px dashed var(--orange)}
.pack.left i{background:var(--orange);border-radius:50%}
.eqs{display:flex;flex-wrap:wrap;gap:10px}
.eq{font-family:var(--mono);font-weight:700;font-size:16px;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.eq b{font-size:19px}
.eq small{font-family:var(--sans);font-weight:700;color:var(--muted);font-size:12px;margin-left:4px}
.eq.a b{color:var(--teal)} .eq.b b{color:var(--orange)} .eq.c{opacity:.75}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card);border-radius:11px;padding:7px 13px;cursor:pointer}
.tab.sans{font-family:var(--sans)}
.tab.on{border-color:var(--hue);background:var(--hue);color:#fff}
.circuit svg{width:100%;height:auto;display:block;max-height:190px}
.circuit .sw{cursor:pointer}
.circuit .wire{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round;transition:stroke .2s}
.circuit .wire.on{stroke:#F2B600}
.circuit .arm{stroke:var(--ink);stroke-width:6;stroke-linecap:round;transition:all .2s}
.circuit .dim{opacity:.3}
.circuit text{font:800 13px var(--mono);fill:var(--ink)}
.verdict{font-family:var(--mono);font-weight:800;font-size:16px;text-align:center}
.verdict .t{color:var(--good)} .verdict .f{color:var(--bad)}
.gates{display:grid;gap:6px;font-family:var(--mono);font-size:14px}
.gate{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:2px solid #343a6b;background:#22264a;color:var(--code-ink);transition:all .2s;flex-wrap:wrap;white-space:pre-wrap}
.gate i{font-style:normal}
.gate .g-res{margin-left:auto;font-weight:900;min-width:64px;text-align:right;font-family:var(--sans);font-size:13px}
.gate.now{border-color:var(--gold);transform:scale(1.01)}
.gate.t{border-color:#3DD08D;background:#173a35;box-shadow:0 0 0 3px rgba(61,208,141,.25)} .gate.t .g-res{color:#3DD08D}
.gate.f{border-color:#FF6B6B;background:#3a2238} .gate.f .g-res{color:#FF8E8E}
.gate.skip{opacity:.38}
.gate .g-res{color:var(--code-dim)}
.gate .brk{font:inherit;font-weight:800;border:2px solid #FF9E7A;color:#FF9E7A;background:none;border-radius:8px;padding:1px 8px;cursor:pointer;margin-left:auto}
.gate .brk.off{text-decoration:line-through;opacity:.45;border-style:dashed}
.gate.run{border-color:#FFD666;background:#2f3157}
.gate .arrow{width:18px;color:#FFD666;font-weight:900}
.printed{font-family:var(--mono);font-weight:800;background:#0B0D1D;color:#D7F5DD;border-radius:12px;padding:10px 14px;min-height:44px}
.printed small{font-family:var(--sans);color:#6C7299;font-weight:800;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-right:10px}
.forline{font-family:var(--mono);font-weight:700;font-size:clamp(13px,3vw,16px);background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px;line-height:2.1;overflow-x:auto;white-space:nowrap}
.ph{display:inline-block;border-radius:9px;padding:0 8px;border:2px solid transparent;transition:all .15s}
.ph sup{font:900 10px var(--sans);margin-right:4px;opacity:.8}
.ph.p1{border-color:#6FD3F2;color:#6FD3F2}.ph.p2{border-color:#FFD666;color:#FFD666}.ph.p3{border-color:#F3A6D8;color:#F3A6D8}.ph.p4{border-color:#A8E38A;color:#A8E38A}
.ph.p1.on{background:#6FD3F2}.ph.p2.on{background:#FFD666}.ph.p3.on{background:#F3A6D8}.ph.p4.on{background:#A8E38A}
.ph.on{color:#161930;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
.mini{display:flex;flex-wrap:wrap;gap:16px 12px;align-items:center}
.grid{display:grid;gap:5px;justify-content:start}
.grid .gr{display:flex;gap:5px}
.grid .gc{width:38px;height:38px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font:700 11px var(--mono);color:var(--muted)}
.grid .gc.done{border-style:solid;border-color:var(--violet);background:color-mix(in srgb,var(--violet) 15%,var(--card));color:var(--ink)}
.grid .gc.cur{border-style:solid;border-color:var(--gold);background:var(--gold);color:#1A1D3A;animation:pop .3s}
.lockers{display:flex;gap:6px;overflow-x:auto;padding:16px 2px 4px;justify-content:center}
.locker{width:58px;flex:none;text-align:center}
.locker .door{height:66px;border-radius:10px;border:2px solid var(--blue);border-bottom-width:5px;background:color-mix(in srgb,var(--blue) 10%,var(--card));display:grid;place-items:center;font:700 19px var(--mono);position:relative;transition:all .15s}
.locker .door:before{content:"";position:absolute;top:8px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--blue);opacity:.5}
.locker small{font:800 12px var(--mono);color:var(--muted);display:block;margin-top:5px}
.locker.cur .door{background:var(--gold);border-color:#C98A00;transform:translateY(-8px)}
.locker.cur small{color:var(--ink)}
.locker.ghost .door{border:2px dashed var(--bad);background:none;color:var(--bad);font-size:20px}
.locker.ghost .door:before{display:none}
.locker.ghost.cur .door{background:var(--bad-bg);animation:shake .3s}

/* ---------- screens ---------- */
.center{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 24px;max-width:480px;width:100%;box-shadow:var(--shadow);display:grid;gap:14px;justify-items:center}
.panel h1{font-size:28px;font-weight:900}
.panel p{color:var(--muted);max-width:40ch}
.big-stars{font-size:44px;letter-spacing:6px;color:var(--gold)}
.big-stars i{font-style:normal;color:var(--line)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:9px 16px;font-weight:900;font-size:19px;min-width:92px}
.stat small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.boss-stage{display:flex;align-items:center;gap:14px;padding:6px 16px 10px;max-width:780px;margin:0 auto;width:100%}
.boss-stage .mon{flex:none;transition:transform .2s}
.boss-stage .mon.hit{animation:shake .35s}
.hp{flex:1}
.hp b{font-weight:900;font-size:14px}
.hp .bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.hp .bar i{display:block;height:100%;background:var(--bad);border-radius:99px;transition:width .4s}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,30,.6);display:grid;place-items:center;padding:14px;animation:fade .15s}
.sheet{background:var(--bg);border-radius:24px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:grid;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:18px;font-weight:900;flex:1}
.sec{margin-top:22px}
.sec>h2{font-size:20px;font-weight:900;margin-bottom:10px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hue);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.mcard:hover{transform:translateY(-2px)}
.mcard b{display:block;font-weight:900}
.mcard small{color:var(--muted);font-size:12.5px}
.mcard.done{background:var(--good-bg)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;margin-top:16px}
.paper h3{font-size:17px;font-weight:900;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paper h3 span{color:var(--muted);font-size:14px}
.timer{font:800 15px var(--mono);padding:6px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.score{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.04em}
.score small{font-size:24px;color:var(--muted)}
select.inp{font-family:var(--sans);font-weight:700;width:auto;max-width:100%}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:90;pointer-events:none;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- does a program output satisfy a test? ---------- */
function findTok(low, w, from) {
  let i = from;
  while ((i = low.indexOf(w, i)) >= 0) {
    const b = low[i - 1], a = low[i + w.length], a2 = low[i + w.length + 1];
    const okB = b === undefined || !(/[a-z0-9.]/.test(b) || (b === '-' && /^\d/.test(w)));
    const okA = a === undefined || !(/[a-z0-9]/.test(a) || (a === '.' && /\d/.test(a2 || '')));
    if (okB && okA) return i;
    i++;
  }
  return -1;
}
const tidy = s => String(s).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '');
G.tidyOut = tidy;
G.matchOut = function (out, t) {
  if (t.exact != null) return tidy(out) === tidy(t.exact);
  const low = String(out).toLowerCase(); let pos = 0;
  for (const w of t.want || []) { const i = findTok(low, w.toLowerCase(), pos); if (i < 0) return false; pos = i + w.length; }
  for (const n of t.not || []) if (findTok(low, n.toLowerCase(), 0) >= 0) return false;
  return true;
};

G.genTrace = function (level) {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), P = a => a[R(0, a.length - 1)];
  const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const pad = l => l + ' '.repeat(Math.max(1, 24 - l.length)) + '//@';
  for (let tries = 0; tries < 600; tries++) {
    let code, vars;
    if (level <= 3) {
      const v = sh(['a', 'b', 'c']), X = v[0], Y = v[1], Z = v[2], pp = () => P(['++', '--']);
      const hard = level > 1;
      const intT = sh([
        () => `${X} ${P(['+=', '-=', '*='])} ${Y} ${P(['*', '+', '-'])} ${Z}${pp()};`,
        () => `${Y} = ${X} ${P(hard ? ['/', '%', '/'] : ['+', '-', '*'])} ${Y} ${P(['+', '-'])} ${pp()}${Z};`,
        () => `${Z} ${P(['+=', '*=', '-='])} ${X}${pp()} ${P(['+', '-'])} ${P(['2', '3', Y])};`,
        () => `${X} ${P(hard ? ['%=', '/=', '-='] : ['-=', '+='])} ${pp()}${Y} ${P(['+', '*'])} ${Z};`,
        () => `${Y} = ${pp()}${X} ${P(['*', '+'])} ${Z}${pp()};`
      ]);
      const dblT = sh([
        () => `d = ${X} / ${Y} + ${Y} / d;`,
        () => `${X} = d * 2 ${P(['+', '-'])} ${Z}${pp()};`,
        () => `d ${P(['+=', '*='])} ${X} / ${P(['2', '4'])};`,
        () => `${Y} = ${X} / ${P(['2.0', '4.0'])} + d;`,
        () => `d = ${pp()}${Z} / 2 + ${X} / ${P(['2.0', '4.0'])};`
      ]);
      const lines = level === 3 ? [intT[0](), intT[1](), dblT[0](), P([dblT[1], intT[2]])()] : [intT[0](), intT[1](), intT[2](), intT[3]()];
      code = `int a = ${R(2, 9)}, b = ${R(2, 9)}, c = ${R(2, 6)};` + (level === 3 ? `\ndouble d = ${P(['1.5', '2.5', '0.5', '2.0', '4.0'])};` : '') + '\n' + lines.map(pad).join('\n');
      vars = level === 3 ? ['a', 'b', 'c', 'd'] : ['a', 'b', 'c'];
    } else {
      const k = R(0, 2);
      if (k === 0) {
        code = `int a = ${R(1, 4)}, b = ${R(12, 22)}, c = ${R(0, 3)};\n` + pad('while (a < b) {') + `\n    a ${P(['+= 3', '+= 4', '*= 2'])};\n    b -= ${R(1, 3)};\n    c ${P(['+= a % 3', '+= b / a', '= c * 2 - 1'])};\n}`;
        vars = ['a', 'b', 'c'];
      } else if (k === 1) {
        code = `int a = 0, b = ${R(20, 40)}, c = 1;\n` + pad(`for (int i = 1; i <= ${R(3, 4)}; i++) {`) + `\n    if (i % 2 == 0)\n        a += i * ${R(2, 4)};\n    else\n        c *= i + ${R(1, 2)};\n    b -= ${P(['a', 'c', 'i'])};\n}`;
        vars = ['i', 'a', 'b', 'c'];
      } else {
        code = `int a = ${R(20, 60)}, b = 0, c = ${R(2, 4)};\n` + pad('do {') + `\n    b += a % c;\n    a /= ${P(['2', '3'])};\n    c++;\n} while (a > ${R(1, 3)});`;
        vars = ['a', 'b', 'c'];
      }
    }
    const r = G.TinyCpp.run(code, {trace: false});
    if (r.error || r.rows.length < 2 || r.rows.length > 5) continue;
    let ok = true;
    for (const row of r.rows) for (const v of vars) { const s = row.vals[v]; if (s === undefined || s === '?' || s.length > 5 || Math.abs(parseFloat(s)) > 400) ok = false; }
    if (!ok) continue;
    const last = r.rows[r.rows.length - 1].vals, first = r.rows[0].vals;
    if (vars.every(v => last[v] === first[v])) continue;
    return {code, vars};
  }
  return {code: 'int a = 5, b = 3, c = 2;\na += b * c++;          //@\nb = a / b - --c;       //@\nc *= b++ + 2;          //@', vars: ['a', 'b', 'c']};
