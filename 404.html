<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JAATools — Page not found</title>
<meta name="description" content="That page does not exist on jaa.tools." />
<meta name="theme-color" content="#05060a" />
<link rel="icon" type="image/svg+xml" href="/jaatools_logo_bg.svg" />
<meta property="og:title" content="JAATools — Page not found" />
<meta property="og:description" content="That page does not exist on jaa.tools." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://jaa.tools/" />
<style>
  :root{
    --bg:#05060a;
    --ink:#f4f5f8;
    --muted:rgba(244,245,248,.56);
    --faint:rgba(244,245,248,.34);
    --line:rgba(244,245,248,.12);
    --violet:#8b5cf6;
    --fuchsia:#e879f9;
    --cyan:#22d3ee;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:grid;
    grid-template-rows:1fr auto;
    overflow-x:hidden;
  }

  /* ---------- ambient background ---------- */
  .aurora{
    position:fixed;
    inset:-20vmax;
    z-index:-2;
    filter:blur(90px);
    opacity:.55;
    pointer-events:none;
  }
  .aurora span{
    position:absolute;
    display:block;
    border-radius:50%;
    mix-blend-mode:screen;
  }
  .aurora .a{
    width:52vmax;height:52vmax;
    top:8%;left:12%;
    background:radial-gradient(circle at 30% 30%, var(--violet), transparent 62%);
    animation:drift-a 26s ease-in-out infinite;
  }
  .aurora .b{
    width:46vmax;height:46vmax;
    top:28%;right:8%;
    background:radial-gradient(circle at 60% 40%, var(--cyan), transparent 62%);
    animation:drift-b 32s ease-in-out infinite;
  }
  .aurora .c{
    width:38vmax;height:38vmax;
    bottom:4%;left:38%;
    background:radial-gradient(circle at 50% 50%, var(--fuchsia), transparent 62%);
    animation:drift-c 38s ease-in-out infinite;
  }
  @keyframes drift-a{50%{transform:translate3d(6vmax,-4vmax,0) scale(1.12)}}
  @keyframes drift-b{50%{transform:translate3d(-7vmax,5vmax,0) scale(1.08)}}
  @keyframes drift-c{50%{transform:translate3d(4vmax,-6vmax,0) scale(1.15)}}

  .grid{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.35;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 42%, #000 10%, transparent 78%);
    mask-image:radial-gradient(ellipse 80% 60% at 50% 42%, #000 10%, transparent 78%);
  }

  /* ---------- layout ---------- */
  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:56px 24px 32px;
  }

  .mark{
    width:84px;height:84px;
    margin-bottom:28px;
    filter:invert(1) drop-shadow(0 0 26px rgba(139,92,246,.55));
    animation:float 7s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-8px)}}

  .wordmark{
    margin:0;
    font-size:clamp(2rem,7vw,3.35rem);
    font-weight:700;
    letter-spacing:.22em;
    text-indent:.22em;
    background:linear-gradient(100deg,#fff 12%, #cfd3ff 46%, #9fe9f6 78%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .rule{
    width:min(320px,72vw);
    height:1px;
    margin:22px 0 24px;
    background:linear-gradient(90deg,transparent,var(--violet),var(--cyan),transparent);
    background-size:200% 100%;
    animation:sweep 5.5s linear infinite;
  }
  @keyframes sweep{to{background-position:200% 0}}

  .status{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    padding:.4rem .95rem;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.04);
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    backdrop-filter:blur(6px);
  }
  .pulse{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 0 0 rgba(34,211,238,.6);
    animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    70%{box-shadow:0 0 0 9px rgba(34,211,238,0)}
    100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}
  }

  .lede{
    max-width:44ch;
    margin:22px auto 0;
    color:var(--muted);
    font-size:clamp(1rem,2.2vw,1.09rem);
    text-wrap:balance;
  }

  .door{
    display:inline-flex;
    align-items:center;
    gap:.75rem;
    margin-top:38px;
    padding:.85rem 1.25rem;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,255,255,.03);
    color:var(--ink);
    text-decoration:none;
    font-size:.94rem;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .door:hover,.door:focus-visible{
    border-color:rgba(139,92,246,.55);
    background:rgba(139,92,246,.10);
    transform:translateY(-2px);
  }
  .door .label{font-weight:600}
  .door .hint{color:var(--faint);font-size:.82rem}
  .door .arrow{transition:transform .25s ease}
  .door:hover .arrow{transform:translateX(3px)}

  footer{
    padding:24px;
    text-align:center;
    color:var(--faint);
    font-size:.78rem;
    letter-spacing:.08em;
  }

  a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:14px}

  @media (max-width:520px){
    .door{flex-direction:row;padding:.8rem 1rem}
    .door .hint{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <img class="mark" src="/jaatools_logo.svg" alt="JAATools logo" width="84" height="84" />

    <h1 class="wordmark">JAATOOLS</h1>

    <div class="rule" aria-hidden="true"></div>

    <p class="status"><span class="pulse" aria-hidden="true"></span> Error 404</p>

    <p class="lede">This page does not exist — or has not been built yet.</p>

    <a class="door" href="/">
      <span class="label">Back to jaa.tools</span>
      <span class="hint">home</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>
  </main>

  <footer>jaa.tools</footer>
</body>
</html>
